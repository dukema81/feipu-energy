<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>飞瀑能源管理系统 · 离线演示</title>
<style>
:root{--bg:#0f1620;--panel:#16202c;--line:#243343;--tx:#e6edf5;--sub:#8ba0b8;--acc:#2aa8a8;--warn:#e6a23c;--bad:#e0544b;--blu:#3d8bfd}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding:0 0 60px}
header{background:linear-gradient(120deg,#0d3038,#0f1620 70%);padding:26px 40px 0;border-bottom:1px solid var(--line)}
h1{font-size:22px;font-weight:600;letter-spacing:.5px}
h1 span.c{color:#3fd0c9}
.sub{color:var(--sub);font-size:13px;margin-top:6px}
.badge{display:inline-block;background:#123a3c;color:#3fd0c9;border:1px solid #2a6b68;border-radius:20px;padding:1px 10px;font-size:12px;margin-left:10px;vertical-align:middle}
nav{display:flex;gap:4px;padding:18px 0;flex-wrap:wrap}
nav button{background:transparent;border:1px solid var(--line);color:var(--sub);padding:7px 16px;border-radius:6px;cursor:pointer;font-size:13px}
nav button.on{background:var(--acc);border-color:var(--acc);color:#fff}
main{padding:24px 40px;max-width:1440px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--acc)}
.card.w::before{background:var(--warn)}.card.b::before{background:var(--bad)}.card.u::before{background:var(--blu)}
.k{color:var(--sub);font-size:12px}
.v{font-size:23px;font-weight:600;margin-top:6px;font-variant-numeric:tabular-nums}
.v small{font-size:12px;color:var(--sub);margin-left:4px;font-weight:400}
h2{font-size:15px;font-weight:600;margin:28px 0 12px;color:#cfe0f0}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;font-size:13px}
th{background:#1b2836;color:var(--sub);font-weight:500;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:12px}
td{padding:9px 12px;border-bottom:1px solid #1c2733;font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:#1a2532}
.r{text-align:right}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px}
.t-ok{background:#123a3c;color:#3fd0c9}.t-w{background:#3a2e16;color:#e6a23c}
.t-b{background:#3a1d1b;color:#f0796f}.t-i{background:#182b42;color:#6aa9f5}
.bar{height:7px;background:#1c2733;border-radius:4px;overflow:hidden;min-width:90px}
.bar i{display:block;height:100%;background:var(--acc)}
.bar i.w{background:var(--warn)}.bar i.b{background:var(--bad)}
.pos{color:#3fd0c9}.neg{color:#f0796f}
footer{color:#5a6b80;font-size:12px;padding:34px 40px 0;text-align:center;line-height:1.9}
.note{background:#1a2330;border-left:3px solid var(--blu);padding:12px 16px;border-radius:6px;color:#a8bccf;font-size:13px;margin-bottom:18px}
/* SVG 图表 */
.chart{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font-size:12px;color:var(--sub)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
</style>
</head>

</header>

function tbl(cols, rows, empty){
  if(!rows || !rows.length) return '<div class="note">'+(empty||'暂无数据')+'</div>';
  let h = '<table><thead><tr>' + cols.map(c=>'<th class="'+(c.r?'r':'')+'">'+c.t+'</th>').join('') + '</tr></thead><tbody>';

// 简易 SVG 折线
function lineChart(rows, key, color, fmt){
  if(!rows || rows.length<2) return '';
  const W=860,H=180,P=36;
  const vs = rows.map(r=>Number(r[key]||0));
  const mn = Math.min(...vs), mx = Math.max(...vs);
  const rng = (mx-mn)||1;
  const x = i => P + i*(W-2*P)/(rows.length-1);
  const y = v => H-24 - (v-mn)/rng*(H-52);
  const pts = vs.map((v,i)=>x(i)+','+y(v)).join(' ');
  let grid='';
  for(let g=0;g<=3;g++){const gy=16+g*(H-44)/3;const gv=mx-g*rng/3;
    grid+='<line x1="'+P+'" y1="'+gy+'" x2="'+(W-P)+'" y2="'+gy+'" stroke="#1c2733"/><text x="4" y="'+(gy+4)+'" fill="#5a6b80" font-size="10">'+fmt(gv)+'</text>';}
  const labels = rows.map((r,i)=>i%Math.ceil(rows.length/8)===0?'<text x="'+x(i)+'" y="'+(H-6)+'" fill="#5a6b80" font-size="10" text-anchor="middle">'+(r.period||'').slice(2)+'</text>':'').join('');
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%">'+grid
    +'<polyline points="'+pts+'" fill="none" stroke="'+color+'" stroke-width="2"/>'
    +vs.map((v,i)=>'<circle cx="'+x(i)+'" cy="'+y(v)+'" r="3" fill="'+color+'"/>').join('')
    +'</svg><div class="legend"><span><i style="background:'+color+'"></i>'+key+'</span></div>';
}

    const p0=[cx+r*Math.cos(a0*Math.PI/180),cy+r*Math.sin(a0*Math.PI/180)];
    const p1=[cx+r*Math.cos(a1*Math.PI/180),cy+r*Math.sin(a1*Math.PI/180)];
    segs+='<path d="M'+cx+','+cy+' L'+p0[0].toFixed(1)+','+p0[1].toFixed(1)
      +' A'+r+','+r+' 0 '+large+' 1 '+p1[0].toFixed(1)+','+p1[1].toFixed(1)+' Z" fill="'+colors[i%colors.length]+'"/>';
    a0=a1;});
  return '<svg viewBox="0 0 190 190" style="width:190px;float:left;margin-right:24px">'
    +segs+'<circle cx="95" cy="95" r="42" fill="var(--panel)"/>'
    +'<text x="95" y="92" text-anchor="middle" fill="#8ba0b8" font-size="11">合计</text>'
    +'<text x="95" y="110" text-anchor="middle" fill="#e6edf5" font-size="14" font-weight="600">'+fmtNum(total)+'</text></svg>';
}

    {t:'因子 tCO₂/单位',r:1,f:r=>num(r.factor)},
    {t:'碳排 tCO₂',r:1,f:r=>'<b>'+num(r.co2)+'</b>'}
  ], D.carbon ? (D.carbon.byEnergy||[]) : []);
  const mo = (D.carbon && D.carbon.months) || [];
  if(mo.length){
    h += '<h2>近 3 期碳排趋势</h2><div class="chart">' + lineChart(mo,'co2','#e0544b',v=>v.toFixed(0)) + '</div>';
  }
  h += '<div class="note">碳排 = Σ 物理量 × 碳排因子。范围一为直接排放（天然气、柴油）；范围二为外购能源间接排放（电力、蒸汽、自来水、压缩空气）。电力因子 0.000581 tCO₂/kWh。</div>';
  return h;
}});

page({id:'balance', t:'能源平衡', render(){
  const bal = (D.balance && D.balance.balance) || {};
  let h = '<div class="grid">'
    + '<div class="card"><div class="k">输入合计</div><div class="v">'+num(bal.totalIn)+'<small>tce</small></div></div>'
    + '<div class="card u"><div class="k">使用合计</div><div class="v">'+num(bal.usedTce)+'<small>tce</small></div></div>'
    + '<div class="card"><div class="k">损耗</div><div class="v">'+num(bal.lossTce)+'<small>tce</small></div></div>'
    + '<div class="card"><div class="k">校验差</div><div class="v" style="color:#3fd0c9">'+money(bal.checkDiff)+'</div></div>'
    + '</div>';
  h += '<h2>分介质输入</h2>' + tbl([
    {t:'介质',k:'name'},{t:'编码',k:'energy'},
    {t:'用量',r:1,f:r=>num(r.qty)},{t:'单位',k:'unit'},
    {t:'折标煤 tce',r:1,f:r=>'<b>'+num(r.tce)+'</b>'}
  ], D.balance ? (D.balance.byEnergy||[]) : []);
  h += '<h2>分中心使用</h2>' + tbl([
    {t:'成本中心',f:r=>(r.center||'')+' '+(r.centerName||'')},
    {t:'折标煤 tce',r:1,f:r=>'<b>'+num(r.tce)+'</b>'}
  ], D.balance ? (D.balance.byCenter||[]) : []);
  h += '<div class="note">能源平衡表：输入合计 = Σ 介质折标煤；使用合计 = Σ 中心折标煤；损耗 = 输入 − 使用；校验差 = 输入 − 使用 − 损耗，恒为 0。</div>';
  return h;
}});

let cur = PAGES[0].id;
function go(id){
  cur = id;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on', b.dataset.id===id));
  const p = PAGES.find(x=>x.id===id);
  $('#main').innerHTML = p.render();
  window.scrollTo(0,0);
}
$('#nav').innerHTML = PAGES.map(p=>'<button data-id="'+p.id+'" onclick="go(\''+p.id+'\')">'+p.t+'</button>').join('');
go(cur);
</script>
</body>
</html>
