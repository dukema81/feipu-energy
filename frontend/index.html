<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>飞瀑能源管理系统</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <aside class="side" id="side">
    <div class="brand">
      <h1>飞瀑能源管理系统</h1>
      <div class="b2">FeiPu Energy Management</div>
    </div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <div class="main">
    <header class="top">
      <span class="menu-btn" onclick="document.getElementById('side').classList.toggle('open')">☰</span>
      <span class="ttl" id="pageTitle">仪表盘</span>
      <span class="sp"></span>
      <span style="font-size:12.5px;color:#6b8299">期间</span>
      <select id="periodSel" onchange="App.setPeriod(this.value)"></select>
      <div class="usr" onclick="App.userMenu()">
        <div class="av" id="avatar">A</div>
        <span id="userName">-</span>
      </div>
    </header>
    <div class="body" id="main"></div>
  </div>
</div>
<script src="app.js"></script>
<script src="dashboard.js"></script>
<script src="master.js"></script>
<script src="meter.js"></script>
<script src="analysis.js"></script>
<script src="efficiency.js"></script>
<script src="alarm.js"></script>
<script src="system.js"></script>
<script>App.start();</script>
</body>
</html>
